<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- Icône BasketTracker : l'anneau de progression (comme les 12 items) autour d'un ballon dessiné en traits, aux couleurs du thème -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2A2F"/><stop offset="1" stop-color="#121214"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2C94C"/><stop offset="1" stop-color="#FF7A1A"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- l'anneau : le fond, puis les 3/4 remplis -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#303035" stroke-width="72"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#ring)" stroke-width="72" stroke-linecap="round" stroke-dasharray="1555 2073" transform="rotate(-90 512 512)" filter="url(#glow)"/>
  <!-- le ballon : graphite, contour et coutures en traits épais du même dégradé, tourné de 35° -->
  <g transform="rotate(35 512 512)" fill="none" stroke="url(#ring)" stroke-width="40" stroke-linecap="round">
    <circle cx="512" cy="512" r="186" fill="#26262A"/>
    <path d="M512 326v372M326 512h372"/>
    <path d="M394 368c62 58 62 230 0 288M630 368c-62 58-62 230 0 288"/>
  </g>
</svg>
